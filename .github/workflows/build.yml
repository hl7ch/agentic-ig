name: Build

# Independent check of every pull request and of main, so that a reviewer does
# not have to trust the build result an agent reports about its own work.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Install the IG tool chain
        run: ./.github/scripts/install-toolchain.sh
      - name: Build
        run: ./_build.sh
      - name: Fail on QA errors
        run: |
          errs=$(python3 -c "import json; print(json.load(open('output/qa.json'))['errs'])")
          echo "IG Publisher errors: $errs"
          [ "$errs" = "0" ]
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa
          path: |
            output/qa.html
            output/qa.json
            output/qa.txt
          if-no-files-found: ignore
